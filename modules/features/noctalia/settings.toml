config_version = 12

[bar.default]
background_opacity = 0.84999998100101948
border = "surface"
center = [ "workspaces" ]
contact_shadow = true
end = [
    "notifications",
    "widget",
    "bar",
    "clipboard",
    "network",
    "bluetooth",
    "cpu",
    "ram",
    "temp",
    "power_profile",
    "battery",
    "settings",
    "session"
]
font_family = "JetBrainsMono Nerd Font"
font_weight = 600
hover_highlight = false
margin_edge = 0
margin_ends = 0
radius = 0
radius_bottom_left = 15
radius_bottom_right = 15
radius_top_left = 0
start = [ "control-center", "clock", "weather", "brightness", "volume", "caffeine", "active_window" ]
thickness = 35
widget_spacing = 15

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
