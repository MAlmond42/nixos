[nightlight]
enabled = true

[notification]
layer = "overlay"

[plugin_settings."avivbintangaringga/nix-monitor"]
show_update_available_notification = false
update_command = "cd /etc/nixos && nix flake update && sudo nixos-rebuild switch && cd /home/mats/.config/home-manager && nix flake update && home-manager switch"

[plugins]
enabled = [
    "noctalia/bitwarden",
    "yuuto/calculator",
    "avivbintangaringga/nix-monitor",
    "thepunkoff/pomodoro",
    "yocraft/battery-widget"
]

[shell]
avatar_path = "/home/mats/.face"
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.launcher]
    compact = true

    [shell.panel]
    clipboard_placement = "floating"
    control_center_placement = "floating"
    launcher_compact = true
    session_placement = "centered"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = true
    size = 15

    [shell.screenshot]
    directory = "~/Pictures/Screenshots/"

[theme]
builtin = "Tokyo-Night"
community_palette = "Everforest"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/mats/Pictures/Wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/mats/Pictures/Wallpapers/bridge_bus.jpg"

    [wallpaper.last]
    path = "/home/mats/Pictures/Wallpapers/bridge_bus.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mats/Pictures/Wallpapers/bridge_bus.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/mats/Pictures/Wallpapers/bridge_bus.jpg"

    [[wallpaper.favorite]]
    community_palette = "Everforest"
    palette_source = "community"
    path = "/home/mats/Pictures/Wallpapers/bridge_bus.jpg"
    theme_mode = "dark"

[widget.active_window]
title_scroll = "on_hover"

[widget.bar]
type = "yuuto/calculator:bar"

[widget.cat]
audio_spectrum = true
capsule_radius = "auto"
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.control-center]
capsule_radius = "auto"
custom_image_colorize = true
glyph = "snowflake"

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
show_labels = false